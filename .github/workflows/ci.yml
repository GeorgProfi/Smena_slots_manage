name: CI

on:
  push:
    branches: [main, classic_auth]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_after_ci:
        description: После успешного CI задеплоить на сервер
        type: boolean
        default: false
      deploy_branch:
        description: Ветка для деплоя (если deploy_after_ci включён)
        type: choice
        default: classic_auth
        options:
          - classic_auth
          - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  migrations:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volunty
          POSTGRES_PASSWORD: volunty
          POSTGRES_DB: volunty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volunty -d volunty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Bootstrap schema (fresh install)
        env:
          PGPASSWORD: volunty
        run: psql -h localhost -U volunty -d volunty -v ON_ERROR_STOP=1 -f docker/postgres/init/01_schema.sql

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://volunty:volunty@localhost:5432/volunty
        run: npm run db:migrate

      - name: Migrations are idempotent (second run)
        env:
          DATABASE_URL: postgresql://volunty:volunty@localhost:5432/volunty
        run: npm run db:migrate

  deploy:
    name: Deploy (manual stage)
    runs-on: ubuntu-latest
    needs: migrations
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_after_ci == true
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_BRANCH,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh