# nginx на хосте (Ubuntu/Debian). Прокси на Docker: 127.0.0.1:3000
# Установка: deploy/nginx/README.md

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream smena_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP — редирект на HTTPS (после выпуска сертификата certbot добавит свой server{} на :443;
# до certbot временно можно проксировать на приложение, см. smenaslots.duckdns.org.http-only.conf)
server {
    listen 80;
    listen [::]:80;
    server_name smenaslots.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smenaslots.duckdns.org;

    # Пути после: sudo certbot --nginx -d smenaslots.duckdns.org
    ssl_certificate     /etc/letsencrypt/live/smenaslots.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smenaslots.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://smena_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
