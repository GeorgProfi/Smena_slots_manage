# Внешний доступ к Postgres (порт на хосте по умолчанию 5433 — не конфликтует с системным :5432)
#
# docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.db-expose.yml up -d
#
# В .env:
#   POSTGRES_PUBLISH_BIND=0.0.0.0
#   POSTGRES_PUBLISH_PORT=5433

services:
  postgres:
    ports:
      - "${POSTGRES_PUBLISH_BIND:-0.0.0.0}:${POSTGRES_PUBLISH_PORT:-5433}:5432"
